name: Release

# Builds the Windows packages and publishes them as a draft GitHub release
# when a version tag is pushed.
#
#   git tag -a v0.1.0 -m "Gotthard 0.1.0" && git push origin v0.1.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PACKAGER_VERSION: "0.11.8"

jobs:
  package:
    name: windows-x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Install cargo-packager
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-packager@${{ env.CARGO_PACKAGER_VERSION }}

      # The installer (NSIS) and the MSI (WiX).
      - name: Build packages
        shell: bash
        run: |
          cargo packager --release -p gotthard-app \
            --formats wix,nsis \
            --out-dir "${{ github.workspace }}/dist"

      # For running without installing.
      - name: Plain binary archive
        shell: bash
        run: |
          mkdir -p dist/archive
          cp target/release/gotthard.exe README.md LICENSE-MIT LICENSE-APACHE dist/archive/
          cd dist/archive
          # A branch run by hand (feat/x) has a slash in its name.
          7z a "../gotthard-${GITHUB_REF_NAME//\//-}-windows-x86_64.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: gotthard-windows-x86_64
          path: |
            dist/*.msi
            dist/*-setup.exe
            dist/*.zip
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          draft: true
